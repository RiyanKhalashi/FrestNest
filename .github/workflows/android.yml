# Builds the FreshNest Android app (APK) and publishes it as a GitHub Release.
# The app opens the live website, so website changes reach phones WITHOUT a new APK.
# A new APK is only built when the app shell itself changes (mobile/), or when started by hand (Actions → Android APK → Run workflow).
name: Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and copy the app shell into Android
        run: |
          npm ci
          npx cap sync android

      - name: Unpack the signing key (same key every build, so updates install over the old app)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/freshnest.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/freshnest.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret missing - building with a throwaway debug key (phones must uninstall before each update)."
          fi

      - name: Build the APK
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/FreshNest.apk"

      - name: Publish as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v1.0.${{ github.run_number }}"
          gh release create "$TAG" "$RUNNER_TEMP/FreshNest.apk" \
            --title "FreshNest app 1.0.${{ github.run_number }}" \
            --notes "Download FreshNest.apk on an Android phone and open it to install. The app shows the live website, so most updates need no new download." \
            --latest
