# Render blueprint for the FreshNest API (Express + Socket.io + timed jobs).
# Render → New → Blueprint → pick this repository. You will be asked for the values marked sync: false.
services:
  - type: web
    name: freshnest-api
    runtime: node
    plan: free
    region: singapore          # closest Render region to Bangladesh
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start    # applies database migrations, then starts the server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL       # Neon connection string (with ?sslmode=require)
        sync: false
      - key: JWT_SECRET         # Render generates a long random secret
        generateValue: true
      - key: WEB_ORIGIN         # your Vercel address, e.g. https://freshnest.vercel.app
        sync: false
      - key: CLOUDINARY_URL     # cloudinary://API_KEY:API_SECRET@CLOUD_NAME
        sync: false
